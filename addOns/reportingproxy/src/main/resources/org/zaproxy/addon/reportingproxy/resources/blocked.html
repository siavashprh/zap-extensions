<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            text-align: center;
            border-top: 5px solid #dc3545;
        }
        h1 {
            color: #dc3545;
            margin-top: 0;
        }
        p {
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .details {
            background-color: #f1f3f5;
            padding: 1rem;
            border-radius: 4px;
            font-family: monospace;
            text-align: left;
            margin-bottom: 1.5rem;
            border: 1px solid #dee2e6;
        }
        .footer {
            font-size: 0.875rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Request Blocked</h1>
        <p>This request was blocked by ZAP.</p>
        
        <div class="details">
            <strong>Violation Details:</strong><br>
            {{DETAILS}}
        </div>
        
        <div class="footer">
            OSS
        </div>
    </div>
</body>
</html>
